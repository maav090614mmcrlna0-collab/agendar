<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Agendar Cita - Citas Medicas</title>
    <link rel="stylesheet" href="estilo_agendar.css">
</head>
<body>

    <div class="columna">
        <h2>AGENDAR CITA</h2>
        <form>
            <label for="nombre_paciente">Nombre del paciente:</label>
            <input type="text" id="nombre_paciente" name="nombre_paciente" placeholder="NOMBRE DEL PACIENTE">

            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad" placeholder="EDAD">

            <label for="horario">Horario:</label>
            <select id="horario" name="horario">
                <option value="">SELECCIONAR FECHA Y HORA</option>
            </select>

            <button class="btn-verde" type="button">AGENDAR</button>
        </form>
    </div>

</body>
</html>
